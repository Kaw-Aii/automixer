[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automixer"
version = "0.1.0"
description = "AI-Driven Digital Twin for Skincare Manufacturing Optimization"
authors = [{name = "Automixer Team"}]
license = {text = "AGPL-3.0"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pydantic>=1.8.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "SQLAlchemy>=1.4.0",
    "alembic>=1.7.0",
    "pyyaml>=5.4.0",
    "python-multipart>=0.0.5",
    "jinja2>=3.0.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.15.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true